<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="sidebar"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <mat-icon class="brand-icon">physical_therapy</mat-icon>
      <span>Rehab Elite</span>
    </div>

    <mat-nav-list class="nav">
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="user">
      <div class="user-name">{{ userName() }}</div>
      <div class="user-role">{{ roleLabel() }}</div>
      <button mat-button class="logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="header">
      @if (isHandset()) {
        <button mat-icon-button aria-label="Abrir menú" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h1 class="page-title">{{ pageTitle() }}</h1>
    </mat-toolbar>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
