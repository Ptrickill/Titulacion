spring:
  application:
    name: rehab-elite
  # No default profile: without one the app runs with these common settings only. Activate "dev" explicitly
  # (synthetic seed data and debug logging, see README); tests activate "test", the Docker image "prod".
  config:
    # The .env file lives in the repository root: ../.env when started from backend/, ./.env when started from the root
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rehab_elite}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Guayaquil
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A database once started with the dev profile has the R__dev_seed repeatable migration in its history;
    # without dev that script is not on the locations, which must not fail validation. Missing versioned
    # migrations are still an error.
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"
  docker:
    compose:
      enabled: false

server:
  # Hosting platforms such as Render inject PORT
  port: ${PORT:8080}
  # Behind a reverse proxy (Render) take the client IP from X-Forwarded-For, trusting only internal proxies
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
