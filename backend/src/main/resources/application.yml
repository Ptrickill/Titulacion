spring:
  application:
    name: rehab-elite
  # No default profile: without one the app runs with these common settings only. Activate "dev" explicitly
  # (synthetic seed data and debug logging, see README); tests activate "test", the Docker image "prod".
  config:
    # The .env file lives in the repository root: ../.env when started from backend/, ./.env when started from the root
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rehab_elite}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Guayaquil
      # Hibernate Envers (HU-18): version history of treatments and therapy sessions. The tables (revinfo and *_aud)
      # come from Flyway (V3); a change to an audited table must change its _aud table in the same migration.
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            store_data_at_delete: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A database once started with the dev profile has the R__dev_seed repeatable migration in its history;
    # without dev that script is not on the locations, which must not fail validation. Missing versioned
    # migrations are still an error.
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"
  docker:
    compose:
      enabled: false

server:
  # Hosting platforms such as Render inject PORT
  port: ${PORT:8080}
  # Behind the Render proxy the client IP (audit_logs.ip_address) comes from X-Forwarded-For. Spring's
  # ForwardedHeaderFilter trusts the header from any caller, so the app must only be reachable through the proxy
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
