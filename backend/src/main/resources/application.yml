spring:
  application:
    name: rehab-elite
  # No default profile: without one the app runs with these common settings only. Activate "dev" explicitly
  # (synthetic seed data and debug logging, see README); tests activate "test", the Docker image "prod".
  config:
    # The .env file lives in the repository root: ../.env when started from backend/, ./.env when started from the root
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rehab_elite}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it
      ddl-auto: validate
    properties:
      # No hibernate.jdbc.time_zone on purpose: with it, a JVM in another zone (UTC in CI and in the Docker image)
      # shifts every time column it writes and reads. Instants (timestamptz) do not depend on the zone, and
      # session_date / session_time are the local date and time of Quito, stored exactly as they arrive.
      # Hibernate Envers (HU-18): version history of treatments and therapy sessions. The tables (revinfo and *_aud)
      # come from Flyway (V3); a change to an audited table must change its _aud table in the same migration.
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            store_data_at_delete: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A database once started with the dev profile has the R__dev_seed repeatable migration in its history;
    # without dev that script is not on the locations, which must not fail validation. Missing versioned
    # migrations are still an error.
    ignore-migration-patterns:
      - "*:future"
      - "repeatable:missing"
  docker:
    compose:
      enabled: false
  # MEJ-01: activation and password reset emails. Mailpit (docker-compose, profile dev) listens on 1025 without
  # authentication; a real SMTP server takes MAIL_USERNAME / MAIL_PASSWORD from .env
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # Use TLS when the server offers it; a broken SMTP server must not hold the request
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # Hosting platforms such as Render inject PORT
  port: ${PORT:8080}
  # Behind the Render proxy the client IP (audit_logs.ip_address) comes from X-Forwarded-For. Spring's
  # ForwardedHeaderFilter trusts the header from any caller, so the app must only be reachable through the proxy
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  # MEJ-05: the initial operations director, created at startup when no active director exists
  initial-director:
    email: ${INITIAL_DIRECTOR_EMAIL:}
    password: ${INITIAL_DIRECTOR_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # MEJ-01: base URL of the public pages linked from the account emails (/activar-cuenta, /restablecer-contrasena)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@rehabelite.local}
    # TEC-16: smtp (default, also when MAIL_TRANSPORT is empty) or api (Brevo's HTTP API, for Render, whose free plan
    # blocks outbound SMTP). See docs/deployment/correo.md
    transport: ${MAIL_TRANSPORT:smtp}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: https://api.brevo.com
      connect-timeout: 5s
      read-timeout: 10s
  # Lifetime of the one-time account links
  tokens:
    activation-ttl: 48h
    reset-ttl: 1h
  # MEJ-04: clinic hours that bound the physiotherapists' schedules. V8 allows at most 07:00 to 20:00; these values
  # may only narrow that range (checked at startup)
  clinic:
    opening-time: "07:00"
    closing-time: "20:00"
