# Test profile: synthetic values so tests never depend on the .env file.
# The real PostgreSQL connection is injected by Testcontainers (@ServiceConnection).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/unused
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        # Lets tests count the SQL statements of a request (HU-09: the clinical record view has no N+1)
        generate_statistics: true

logging:
  level:
    # With statistics on, Hibernate logs a summary per session at INFO; keep the test output quiet
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

app:
  jwt:
    secret: test-only-secret-for-automated-tests-0123456789
    expiration-minutes: 30
  admin:
    email: admin.test@rehabelite.test
    password: TestPassword.2026
  cors:
    allowed-origins: http://localhost:4200
  ai:
    anthropic-api-key: ""
